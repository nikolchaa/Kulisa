# What `cargo xtask licenses` lists: everything linked into the tool or a player, on any target.
# In order of preference where a crate offers a choice.
accepted = [
    "MIT",
    "0BSD",
    "Zlib",
    "ISC",
    "Unlicense",
    "CC0-1.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "Unicode-3.0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MPL-2.0",
]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "wasm32-unknown-unknown",
    "aarch64-linux-android",
    "armv7-linux-androideabi",
    "x86_64-linux-android",
    "aarch64-apple-ios",
    "aarch64-apple-ios-sim",
]
ignore-build-dependencies = true
ignore-dev-dependencies = true
private = { ignore = true }
