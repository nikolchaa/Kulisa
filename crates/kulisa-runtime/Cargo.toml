[package]
name = "kulisa-runtime"
description = "Frame loop and subsystem wiring for the Kulisa engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
gilrs = "0.11.2"
kulisa-core.workspace = true
kulisa-lua.workspace = true
kulisa-platform.workspace = true
kulisa-render.workspace = true
kulisa-video.workspace = true
log.workspace = true
web-time.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
jni-sys = "0.3"
ndk-sys = "0.6"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Media_Speech", "Win32_System_Com"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSString"] }

[target.'cfg(target_os = "ios")'.dependencies]
objc2 = "0.5"
block2 = "0.5"
objc2-foundation = { version = "0.2", features = ["NSThread", "NSNotification", "NSOperation", "NSString", "NSGeometry", "NSObject", "block2"] }
objc2-core-motion = { version = "0.2", features = ["CMMotionManager", "CMDeviceMotion", "CMLogItem", "CMGyro", "CMAccelerometer"] }
objc2-ui-kit = { version = "0.2", features = ["UIFeedbackGenerator", "UIImpactFeedbackGenerator", "UIWindow"] }
