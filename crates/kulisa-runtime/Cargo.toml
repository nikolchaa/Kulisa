[package]
name = "kulisa-runtime"
description = "Frame loop and subsystem wiring for the Kulisa engine."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
gilrs = "0.11.2"
kulisa-core.workspace = true
kulisa-lua.workspace = true
kulisa-platform.workspace = true
kulisa-render.workspace = true
log.workspace = true
web-time.workspace = true
winit.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
jni-sys = "0.3"
