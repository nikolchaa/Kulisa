[package]
name = "kulisa-platform"
description = "Platform services for the Kulisa engine: logging, files, save paths, device features."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
log.workspace = true

[target.'cfg(not(any(target_os = "android", target_os = "ios", target_arch = "wasm32")))'.dependencies]
env_logger = { version = "0.11", default-features = false, features = ["auto-color", "humantime"] }

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.15"

# Unified logging (Console.app, `log show`); iOS apps have no visible stderr.
[target.'cfg(target_os = "ios")'.dependencies]
oslog = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
console_log = "1"
js-sys = "0.3"
wasm-bindgen.workspace = true
wasm-bindgen-futures.workspace = true
web-sys = { version = "0.3", features = ["CssStyleDeclaration", "DeviceMotionEvent", "DeviceOrientationEvent", "DeviceRotationRate", "Document", "Element", "Event", "EventTarget", "HtmlElement", "HtmlInputElement", "InputEvent", "KeyboardEvent", "Location", "Navigator", "Node", "OrientationLockType", "Response", "Screen", "ScreenOrientation", "Storage", "VisualViewport", "Window"] }
