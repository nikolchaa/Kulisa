# Game settings, read by the engine at startup and by `kulisa build` (app ids, titles,
# orientation). Scripts see them as `kulisa.config`.

[game]
# Save folder and app id: change it for your game.
id = "kulisa_text_rpg"
title = "The Lantern Road"
version = "1.0.0"

# The same keys as kulisa.display{}; the engine applies them before main.luau runs.
# Landscape on desktops and tablets; phones play in portrait with their own layout (ui/main).
[display]
width = 1920
height = 1080
scale = "expand"
aspect = ["4:3", "21:9"]
orientation = "landscape"
phone = { width = 1080, height = 1920, orientation = "portrait", aspect = ["9:22", "3:4"] }
