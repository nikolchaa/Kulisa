[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"
repository = "https://github.com/nikolchaa/Kulisa"

[workspace.dependencies]
kulisa-audio = { path = "crates/kulisa-audio" }
kulisa-cli = { path = "crates/kulisa-cli" }
kulisa-core = { path = "crates/kulisa-core" }
kulisa-platform = { path = "crates/kulisa-platform" }
kulisa-render = { path = "crates/kulisa-render" }
kulisa-renpy = { path = "crates/kulisa-renpy" }
kulisa-lua = { path = "crates/kulisa-lua" }
kulisa-runtime = { path = "crates/kulisa-runtime" }
kulisa-story = { path = "crates/kulisa-story" }
kulisa-text = { path = "crates/kulisa-text" }
kulisa-ui = { path = "crates/kulisa-ui" }

cosmic-text = "0.19"
bytemuck = { version = "1.25", features = ["derive"] }
glam = "0.34"
# cpal backend without the D-Bus realtime extra (no libdbus needed on Linux).
kira = { version = "0.12", default-features = false, features = ["cpal", "cpal-realtime", "ogg", "vorbis", "wav", "pcm", "mp3", "flac"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
log = "0.4"
mlua = { version = "0.12", features = ["luau", "vendored"] }
pollster = "1"
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
web-time = "1"
wgpu = { version = "30", features = ["webgl"] }
winit = "0.30"

[patch.crates-io]
mlua = { path = "third_party/mlua" }
