name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: 0

# Build steps tee into ci.log; on failure the errors become an annotation
# (job logs need a GitHub sign-in to read, annotations do not).
defaults:
  run:
    shell: bash

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check 2>&1 | tee -a ci.log
      - run: python3 .github/scripts/check-vendored-mlua.py 2>&1 | tee -a ci.log
      - run: cargo clippy --workspace --all-targets -- -D warnings 2>&1 | tee -a ci.log
      - if: failure()
        run: .github/scripts/annotate-errors.sh ci.log

  desktop:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Windows, os: windows-latest }
          - { name: Linux, os: ubuntu-latest }
          - { name: macOS, os: macos-latest }
    runs-on: ${{ matrix.os }}
    env:
      # Headless GPU tests must run, not skip: software Vulkan (lavapipe) on Linux,
      # WARP on Windows, Metal on macOS.
      KULISA_REQUIRE_GPU: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -yq mesa-vulkan-drivers
      - run: cargo test --workspace 2>&1 | tee -a ci.log
      - run: cargo build -p kulisa-player 2>&1 | tee -a ci.log
      - if: failure()
        run: .github/scripts/annotate-errors.sh ci.log

  ios:
    name: iOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios, aarch64-apple-ios-sim
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p kulisa-player --target aarch64-apple-ios 2>&1 | tee -a ci.log
      - run: cargo xtask ios-app --sim 2>&1 | tee -a ci.log
      # Boots a simulator, launches the app and checks the Luau log line.
      - run: .github/scripts/ios-sim-smoke.sh 2>&1 | tee -a ci.log
      - if: failure()
        run: .github/scripts/annotate-errors.sh ci.log
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kulisa-ios-sim
          path: |
            dist/ios/*.png
            dist/ios/*.log
          if-no-files-found: ignore

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask apk --abi arm64-v8a,x86_64 2>&1 | tee -a ci.log
      - if: failure()
        run: .github/scripts/annotate-errors.sh ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: kulisa-android
          path: dist/android/kulisa.apk

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # Luau's C++ needs a clang with wasm exception handling (exnref).
      - uses: KyleMayes/install-llvm-action@v2
        with:
          version: "21"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen@0.2.129
      - run: cargo xtask web --release 2>&1 | tee -a ci.log
      - if: failure()
        run: .github/scripts/annotate-errors.sh ci.log
      - uses: actions/upload-artifact@v4
        with:
          name: kulisa-web
          path: dist/web
